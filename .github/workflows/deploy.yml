name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: qdbh2026-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_SSH_PORT }}
          script: |
            set -euo pipefail

            APP_DIR=/root/HNUSTAIassistant
            test -d "$APP_DIR/.git"
            cd "$APP_DIR"

            git fetch origin master
            git pull --ff-only origin master

            source /root/.nvm/nvm.sh
            nvm use 24
            node -v
            npm install --production

            pm2 kill || true
            pm2 start ecosystem.config.js --update-env
            pm2 save

            # Re-apply the reverse-proxy config on every deployment so port 80
            # cannot keep pointing at an old site or stale Nginx configuration.
            sudo install -m 644 deploy/nginx-qdbh2026.conf /etc/nginx/sites-available/qdbh2026.conf
            sudo ln -sf /etc/nginx/sites-available/qdbh2026.conf /etc/nginx/sites-enabled/qdbh2026.conf
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx || sudo service nginx reload

            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 10 ]; then
                pm2 status
                pm2 logs qdbh2026 --lines 80 --nostream || true
                exit 1
              fi
              sleep 2
            done

            # Verify public entry points and the private admin login page. The legacy
            # /admin paths are intentionally expected to return 404.
            ADMIN_PATH=$(sed -n 's/^ADMIN_PATH=//p' .env | head -n 1 | tr -d '\r')
            ADMIN_PATH=${ADMIN_PATH:-/qdbh-console-7f3a9d2c}
            ADMIN_LOGIN_PATH="${ADMIN_PATH%/}/login"

            for path in / /guide /admin.css /admin.js "$ADMIN_LOGIN_PATH"; do
              curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:3000${path}" > /dev/null
              curl --fail --silent --show-error --max-time 10 "http://127.0.0.1${path}" > /dev/null
            done

            legacy_admin_status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin)
            legacy_login_status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin/login)
            test "$legacy_admin_status" = "404"
            test "$legacy_login_status" = "404"

            for path in / /guide /admin.css /admin.js "$ADMIN_LOGIN_PATH"; do
              node_hash=$(curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:3000${path}" | sha256sum | awk '{print $1}')
              nginx_hash=$(curl --fail --silent --show-error --max-time 10 "http://127.0.0.1${path}" | sha256sum | awk '{print $1}')
              test "$node_hash" = "$nginx_hash"
            done
            echo "Deployed commit: $(git rev-parse --short HEAD)"
