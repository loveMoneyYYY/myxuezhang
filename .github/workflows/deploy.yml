name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: qdbh2026-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_SSH_PORT }}
          script: |
            set -euo pipefail

            APP_DIR=/root/HNUSTAIassistant
            test -d "$APP_DIR/.git"
            cd "$APP_DIR"

            git fetch origin master
            git pull --ff-only origin master

            source /root/.nvm/nvm.sh
            nvm use 24
            node -v
            npm install --production

            pm2 kill || true
            pm2 start ecosystem.config.js --update-env
            pm2 save

            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 10 ]; then
                pm2 status
                pm2 logs qdbh2026 --lines 80 --nostream || true
                exit 1
              fi
              sleep 2
            done
            echo "Deployed commit: $(git rev-parse --short HEAD)"
