name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: qdbh2026-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_SSH_PORT }}
          script: |
            set -euo pipefail

            APP_DIR=/root/HNUSTAIassistant
            test -d "$APP_DIR/.git"
            cd "$APP_DIR"

            git fetch origin master
            git pull --ff-only origin master
            npm install --production
            pm2 restart qdbh2026 --update-env

            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ > /dev/null
            echo "Deployed commit: $(git rev-parse --short HEAD)"
