<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台配置 · 新生答疑助手</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-header">
        <div>
          <h1>后台配置</h1>
          <p>通过表单快速维护回答条目和页面内容，支持多种提问方式匹配。</p>
        </div>
        <a class="admin-back" href="/">返回首页</a>
      </header>
      <section class="admin-actions">
        <button id="loadConfig">加载配置</button>
        <button id="saveConfig">保存配置</button>
      </section>
      <div class="admin-layout">
        <aside class="sidebar">
          <button type="button" data-section="basic" class="active">基础信息</button>
          <button type="button" data-section="guide">二级页面配置</button>
          <button type="button" data-section="sticky">悬浮联系卡</button>
          <button type="button" data-section="feature">功能按钮</button>
          <button type="button" data-section="faq">问答配置</button>
        </aside>
        <div class="content-area">
          <form class="admin-form" id="adminForm">
            <section class="section-panel" data-section="basic">
              <h2>基础信息</h2>
              <div class="field-row">
                <label>站点标题</label>
                <input id="siteTitle" />
              </div>
              <div class="field-row">
                <label>页面标题</label>
                <input id="heroTitle" />
              </div>
              <div class="field-row">
                <label>副标题</label>
                <input id="heroSubtitle" />
              </div>
              <div class="field-row">
                <label>页面说明</label>
                <textarea id="description"></textarea>
              </div>
              <div class="field-row">
                <label>学校简介</label>
                <input id="schoolIntro" />
              </div>
              <div class="field-row">
                <label>免责声明</label>
                <textarea id="disclaimer"></textarea>
              </div>
              <div class="field-row">
                <label>网站 Logo 图片 URL</label>
                <input id="siteLogoUrl" placeholder="例如 /pic/学校logo.png" />
              </div>
              <div class="field-row">
                <label>主视觉背景图片 URL</label>
                <input id="heroImageUrl" placeholder="例如 /pic/hero-bg.svg" />
              </div>
              <div class="field-row">
                <label>二维码图片 URL</label>
                <input id="qrImageUrl" placeholder="例如 /pic/wechat-qr.svg" />
              </div>
              <div class="field-row">
                <label>默认回答</label>
                <textarea id="defaultAnswer"></textarea>
              </div>
            </section>

            <section class="section-panel hidden" data-section="guide">
              <h2>二级页面配置</h2>
              <p class="section-tip">用于维护“报到 / 宿舍 / 生活”等分类帖文，支持富文本与附件上传（图片、PDF、文档）。</p>
              <div class="field-row">
                <label>入口标题（首页展示）</label>
                <input id="guideEntryTitle" placeholder="例如：报到、宿舍、生活分类帖文" />
              </div>
              <div class="field-row">
                <label>入口说明（首页展示）</label>
                <input id="guideEntryDescription" placeholder="例如：支持分类、折叠与附件预览" />
              </div>
              <div class="field-row">
                <label>导览页主标题</label>
                <input id="guidePageTitle" placeholder="例如：新生报到导览" />
              </div>
              <div class="field-row">
                <label>导览页副标题</label>
                <input id="guidePageSubtitle" placeholder="例如：分类帖文 · 可折叠查看" />
              </div>
              <div class="field-row">
                <label>导览页 Hero 标题</label>
                <input id="guideHeroTitle" placeholder="例如：报到、宿舍、生活一站式导览" />
              </div>
              <div class="field-row">
                <label>导览页 Hero 说明</label>
                <textarea id="guideHeroSummary" placeholder="导览页顶部文案"></textarea>
              </div>
              <div class="field-row">
                <label>导览页 Hero 背景图 URL</label>
                <input id="guideHeroImageUrl" placeholder="例如 /pic/学校校门.jpg" />
              </div>

              <div class="guide-toolbar-block">
                <strong>附件上传</strong>
                <p>先上传图片或文档，再插入到帖子封面或附件列表中。</p>
                <div class="upload-row">
                  <div class="upload-dropzone" id="guideUploadDropzone" tabindex="0" role="button">
                    <strong>拖拽文件到这里</strong>
                    <span>或点击选择本地文件（支持多选）</span>
                    <input id="guideUploadInput" type="file" multiple />
                  </div>
                  <button type="button" class="secondary" id="guideUploadButton">上传文件</button>
                </div>
                <div class="upload-result" id="uploadResult"></div>
              </div>

              <div id="guideCategories"></div>
              <button type="button" class="secondary" id="addGuideCategory">新增分类</button>
            </section>

            <section class="section-panel hidden" data-section="sticky">
              <h2>悬浮联系卡</h2>
              <div id="stickyContacts"></div>
              <button type="button" class="secondary" id="addSticky">新增联系卡</button>
            </section>

            <section class="section-panel hidden" data-section="feature">
              <h2>功能按钮</h2>
              <div id="featureButtons"></div>
              <button type="button" class="secondary" id="addFeature">新增功能按钮</button>
            </section>

            <section class="section-panel hidden" data-section="faq">
              <h2>问答配置</h2>
              <div id="faqItems"></div>
              <button type="button" class="secondary" id="addFaq">新增回答项</button>
            </section>

            <section class="admin-status" id="status"></section>
          </form>
        </div>
      </div>
    </div>

    <div class="dialog-modal hidden" id="saveModal">
      <div class="dialog-backdrop" id="dialogBackdrop"></div>
      <div class="dialog-card">
        <h3>保存成功</h3>
        <p id="saveModalMessage">配置已更新并保存。</p>
        <button type="button" id="closeModal">知道了</button>
      </div>
    </div>

    <div class="preview-modal hidden" id="previewModal">
      <div class="dialog-backdrop" id="previewBackdrop"></div>
      <div class="preview-card" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <div class="preview-card-header">
          <div>
            <span class="preview-eyebrow">发布前预览</span>
            <h3 id="previewTitle">帖子预览</h3>
          </div>
          <button type="button" class="preview-close" id="closePreview" aria-label="关闭预览">×</button>
        </div>
        <div class="preview-page" id="previewContent"></div>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
