<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白羊学长 · 新生答疑助手</title>
    <link rel="icon" href="/pic/学校logo.png" type="image/png">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-icon"></div>
            <div class="brand-copy">
              <strong id="brandTitle">湖南科技大学</strong>
              <small id="brandSubtitle">白羊学长新生答疑助手 · 在线</small>
            </div>
          </div>
        </div>
      </header>

      <main class="page-content">
        <section class="hero-card">
          <div class="hero-top">
            <div class="hero-image" id="heroImage"></div>
            <div class="hero-copy">
              <p class="eyebrow" id="siteTitle">湖南科技大学</p>
              <h1 id="heroTitle">入学答疑站</h1>
              <p id="heroSubtitle" class="hero-subtitle">白羊学长 · 新生专属智能问答</p>
              <p id="heroDescription" class="hero-description"></p>

              <div class="hero-badge">
                <span class="hero-badge-icon">N</span>
                <div>
                  <strong>校园导览</strong>
                  <p>快速了解报到、宿舍、生活等信息</p>
                </div>
              </div>

              <p class="hero-notice" id="heroNotice">知识库已接入校园知识，可直接提问</p>

              <div class="hero-info-grid" id="heroInfoCards"></div>
            </div>
          </div>
        </section>

        <section class="action-grid" id="heroContacts"></section>
        <section class="feature-grid" id="menuButtons"></section>

        <section class="qr-panel">
          <div class="qr-card">
            <div class="qr-image" id="qrImage"></div>
            <div class="qr-copy">
              <p>新生资料包</p>
              <strong>添加微信 开学免费送福利</strong>
              <p>长按识别二维码，获取更多校园信息</p>
            </div>
          </div>
          <div class="help-copy">
            <p id="schoolIntro">湖南科技大学 · 26级新生答疑平台</p>
            <p id="disclaimer">AI 回答仅供参考，招生、收费、报到等动态信息以学校官方通知为准。</p>
          </div>
        </section>

        <section class="chat-panel">
          <div class="chat-history" id="chatHistory"></div>
        </section>
      </main>

      <div class="bottom-bar">
        <form class="bottom-form" id="chatForm">
          <div class="bottom-input">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.5 3a7.5 7.5 0 015.92 12.19l4.7 4.7a1 1 0 11-1.42 1.42l-4.7-4.7A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z" fill="currentColor" />
            </svg>
            <input id="chatInput" placeholder="输入你想了解的学校问题 ~" autocomplete="off" />
          </div>
          <button type="submit">问一下</button>
        </form>
        <p class="bottom-hint">AI 回答仅供参考，招生、收费、报到等动态信息以学校官方通知为准</p>
      </div>
    </div>

    <div class="image-modal hidden" id="imageModal">
      <div class="image-modal-backdrop" id="modalBackdrop"></div>
      <div class="image-modal-card">
        <button class="close-button" id="modalClose">×</button>
        <img id="modalImage" alt="扫码图片" />
        <p id="modalLabel"></p>
        <p id="modalDescription"></p>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
